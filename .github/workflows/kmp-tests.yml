name: KMP Tests

on:
  push:
    branches: [main, 'codex/**']
  pull_request:

permissions:
  contents: read

jobs:
  common-tests:
    name: Common and iOS tests
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create test build configuration
        run: printf 'GOOGLE_AUTH_SERVER_ID=ci-test-client-id.apps.googleusercontent.com\n' > .env

      - name: Run KMP unit tests
        run: ./gradlew :composeApp:testDebugUnitTest :composeApp:testReleaseUnitTest :composeApp:allTests --no-daemon

      - name: Upload JVM and native test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: common-test-reports
          if-no-files-found: ignore
          path: |
            composeApp/build/reports/tests/**
            composeApp/build/test-results/**

  android-ui-tests:
    name: Android Compose UI and database tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Create test build configuration
        run: printf 'GOOGLE_AUTH_SERVER_ID=ci-test-client-id.apps.googleusercontent.com\n' > .env

      - name: Run Android instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: ./gradlew :composeApp:connectedDebugAndroidTest --no-daemon

      - name: Upload Android test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-instrumented-test-reports
          if-no-files-found: ignore
          path: |
            composeApp/build/reports/androidTests/**
            composeApp/build/outputs/androidTest-results/**
